[package]
name = "binsql"
description = "A database IDE for the terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "binsql"
path = "src/lib.rs"

[[bin]]
name = "binsql"
path = "src/main.rs"

[dependencies]
binsql-core = { path = "../binsql-core" }

anyhow.workspace = true
tokio.workspace = true

ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", default-features = false, features = [
    "crossterm",
    "ratatui",
    "search",
] }
unicode-width = "0.2"
futures-util.workspace = true
tokio-util = "0.7"
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
