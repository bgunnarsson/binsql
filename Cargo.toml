[workspace]
members = ["crates/binsql-core", "crates/binsql"]
resolver = "3"

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/bgunnarsson/binsql"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "process",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
